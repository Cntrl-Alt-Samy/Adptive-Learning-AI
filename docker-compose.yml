services:
  postgres:
    image: postgres:16-alpine
    container_name: learnos-postgres
    environment:
      POSTGRES_USER: learnos
      POSTGRES_PASSWORD: learnos-dev
      POSTGRES_DB: learnos_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnos -d learnos_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - learnos-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: learnos-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  learnos-pgdata:
